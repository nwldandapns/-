name: Deploy Omok Rank

on:
  push:
    branches: ["main"]
    paths:
      - "omok/**"
      - ".github/workflows/omok-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "omok-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Omok site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./omok
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
